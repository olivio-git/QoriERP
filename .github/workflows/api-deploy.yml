name: Deploy API

on:
  push:
    tags:
      - 'api/v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @qori/api typecheck

      - name: Build
        run: pnpm --filter @qori/api build

      # TODO: agregar step de deploy al VPS/servidor
